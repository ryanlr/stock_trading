name: Fetch rates data
on:
  push:
    branches: [main]
    paths: ["tools/rates/fetch_fed.py", ".github/workflows/rates-data.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas
      - run: python tools/rates/fetch_fed.py
      - run: |
          git config user.name "refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates
          git diff --cached --quiet && exit 0
          git commit -m "Fetch rates data"
          git pull --rebase origin main
          git push
