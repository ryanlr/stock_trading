name: Refresh report data

on:
  push:
    branches: [main]
    paths: ["tools/refresh/**", ".github/workflows/refresh-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas lxml
      - run: python tools/refresh/fetch_refresh.py
      - name: Commit data
        run: |
          git config user.name "refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh report data ($(python -c "import json;print(json.load(open('data/refresh/meta.json'))['qqq_last'])"))"
          git pull --rebase origin main
          git push
