name: Build QQQ buy-point radar (prediction.html)

on:
  schedule:
    - cron: "17 22 * * 1-5"   # after the US close (22:17 UTC = 6:17pm EDT / 5:17pm EST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/market-risk-playbook/scripts/**"
      - ".github/workflows/playbook.yml"

permissions:
  contents: write

concurrency:
  group: playbook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas numpy
      - name: Fetch QQQ data and option chain
        run: python skills/market-risk-playbook/scripts/fetch_data.py --data-dir skills/market-risk-playbook/data
      - name: Build page
        run: |
          python skills/market-risk-playbook/scripts/build_playbook.py \
            --out prediction.html \
            --data-dir skills/market-risk-playbook/data \
            --json skills/market-risk-playbook/data/latest.json
      - name: Commit if changed
        run: |
          git config user.name "playbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction.html skills/market-risk-playbook/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update prediction.html ($(python -c "import json;print(json.load(open('skills/market-risk-playbook/data/latest.json'))['date'])"))"
          git pull --rebase origin main
          git push
