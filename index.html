<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stock_trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: site root — title, one line, one link card to reports/. Light only, same tokens as reports/index.html. */
:root{--paper:#F6F8FA;--sheet:#FFFFFF;--ink:#14202B;--muted:#5B6875;--rule:#D9E0E7;--link:#1E3A5F;--blue:#245DE1;
  --display:"Noto Serif SC","Songti SC",serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0}
p{margin:0;max-width:68ch}
a.card{display:flex;flex-direction:column;gap:6px;max-width:460px;background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--blue);padding:18px 20px;color:inherit;text-decoration:none;transition:box-shadow .15s}
a.card:hover,a.card:focus-visible{box-shadow:0 6px 18px rgba(20,32,43,.12);outline:none}
a.card h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
a.card .f{font-family:var(--mono);font-size:12px;color:var(--muted)}
a.card .go{font-size:13.5px;color:var(--link);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ryanlr / stock_trading</div>
  <h1>stock_trading</h1>
  <p>美股专题研究与数据报告。</p>
  <a class="card" href="reports/">
    <span class="f">reports/</span>
    <h2>市场报告</h2>
    <span>所有报告的目录</span>
    <span class="go">进入 →</span>
  </a>
</div>
</body>
</html>
